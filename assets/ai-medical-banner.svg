<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Sasindu Jayawardana AI and Medical Intelligence banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="48%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="120" fill="#0ea5e9" opacity="0.07"/>
  <circle cx="1120" cy="260" r="150" fill="#14b8a6" opacity="0.07"/>

  <!-- AI neural network motif -->
  <g stroke="url(#accent)" stroke-width="2.2" opacity="0.92" filter="url(#glow)">
    <line x1="105" y1="95" x2="175" y2="70"/>
    <line x1="105" y1="95" x2="175" y2="130"/>
    <line x1="105" y1="165" x2="175" y2="130"/>
    <line x1="105" y1="165" x2="175" y2="205"/>
    <line x1="175" y1="70" x2="245" y2="105"/>
    <line x1="175" y1="130" x2="245" y2="105"/>
    <line x1="175" y1="130" x2="245" y2="175"/>
    <line x1="175" y1="205" x2="245" y2="175"/>
    <line x1="245" y1="105" x2="305" y2="140"/>
    <line x1="245" y1="175" x2="305" y2="140"/>
  </g>
  <g fill="#0f172a" stroke-width="3" stroke="url(#accent)">
    <circle cx="105" cy="95" r="9"/><circle cx="105" cy="165" r="9"/>
    <circle cx="175" cy="70" r="9"/><circle cx="175" cy="130" r="9"/><circle cx="175" cy="205" r="9"/>
    <circle cx="245" cy="105" r="9"/><circle cx="245" cy="175" r="9"/>
    <circle cx="305" cy="140" r="11"/>
  </g>

  <!-- Medical cross + cell motif -->
  <g transform="translate(955 68)">
    <circle cx="90" cy="90" r="72" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.35"/>
    <circle cx="90" cy="90" r="48" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="78" y="54" width="24" height="72" rx="5" fill="#2dd4bf"/>
    <rect x="54" y="78" width="72" height="24" rx="5" fill="#2dd4bf"/>
    <circle cx="28" cy="32" r="7" fill="#8b5cf6"/>
    <circle cx="150" cy="35" r="5" fill="#38bdf8"/>
    <circle cx="155" cy="145" r="8" fill="#2dd4bf"/>
    <circle cx="23" cy="148" r="5" fill="#38bdf8"/>
  </g>

  <text x="370" y="112" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">
    Sasindu Jayawardana
  </text>
  <text x="370" y="160" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    AI • Computer Vision • Medical Intelligence
  </text>
  <text x="370" y="205" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    Building practical ML systems with a long-term mission in oncology.
  </text>

  <rect x="370" y="235" width="510" height="36" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="395" y="259" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    Python-first • PyTorch • CNNs • Explainable AI • ML Engineering • R&amp;D
  </text>
</svg>